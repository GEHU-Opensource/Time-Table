name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: timetable_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d timetable_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff format
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: No comments
        run: python scripts/check_no_comments.py

      - name: Template constraints
        run: python scripts/check_templates.py

      - name: Import contracts
        run: lint-imports

      - name: Migrations are committed
        env:
          ENV: test
          SECRET_KEY: ci-only-9f3b1c7d2e8a4056b7c1d9e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2
          BASE_DOMAIN: testserver
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/timetable_dev
        run: python manage.py makemigrations --check --dry-run

      - name: Deployment checks
        env:
          ENV: prod
          SECURE: "true"
          DEBUG: "false"
          SECRET_KEY: ci-only-9f3b1c7d2e8a4056b7c1d9e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2
          BASE_DOMAIN: ci.invalid
          DB_SSLMODE: disable
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/timetable_dev
        run: python manage.py check --deploy --fail-level WARNING

      - name: Tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/timetable_dev
        run: pytest -q

      - name: Dependency audit
        run: pip-audit -r requirements.txt

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_SUMMARY: "true"
